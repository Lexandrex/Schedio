# Análise estática do SonarCloud, rodada pelo job `analise` do ci.yml.
#
# A organização e a chave do projeto são as que o SonarCloud mostra em
# Information (canto inferior esquerdo da página do projeto). Se forem outras,
# corrija aqui: o scan falha com "Project not found" quando não batem.
sonar.organization=lexandrex
sonar.projectKey=Lexandrex_Schedio
sonar.projectName=Schedio Drasis

sonar.sourceEncoding=UTF-8

# Código: backend (raiz) e client/src. Os testes ficam fora das fontes e entram
# como testes, senão o Sonar os indexaria duas vezes (e falha).
sonar.sources=.
sonar.exclusions=node_modules/**,client/node_modules/**,client/dist/**,coverage/**,Screenshots/**,docs/**,infra/**,estudo/**,tests/**,client/tests/**,**/*.png,**/*.jpg
sonar.tests=tests,client/tests
sonar.test.inclusions=tests/**/*.mjs,tests/**/*.cjs,client/tests/**/*.js,client/tests/**/*.jsx

# Cobertura dos dois runners: c8 (node:test, backend + módulos puros do client)
# e Vitest (componentes). O Sonar soma os dois por arquivo.
# O número dele NÃO é a meta 75/25: essa é medida por `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/client/lcov.info
# Scripts de diagnóstico e migração rodam à mão, sem teste: fora da conta.
sonar.coverage.exclusions=scripts/**,client/src/main.jsx

# O job espera o resultado do Quality Gate e falha se ele reprovar.
sonar.qualitygate.wait=true
