# Dependabot: abre PRs atualizando dependências com vulnerabilidade conhecida
# (com os "Dependabot alerts" ligados em Settings → Code security) e, toda
# semana, as que ficaram para trás. Cada PR passa pelo CI inteiro antes do merge.
#
# Os dois pacotes npm são independentes (raiz = backend, client/ = React), por
# isso aparecem separados.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(backend)'
    groups:
      # Patches e minors juntos num PR só, para não inundar a fila.
      backend-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(client)'
    groups:
      client-menores:
        update-types: [minor, patch]

  # As actions usadas nos workflows (checkout, setup-node, azure/login...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps(actions)'
